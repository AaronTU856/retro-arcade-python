repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff
        name: Ruff linting
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff formatting
        entry: ruff format
        language: system
        types: [python]
